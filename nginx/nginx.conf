worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    # Conditional WebSocket upgrade — proxy_set_header Connection cần map này
    # để KHÔNG gửi "Upgrade" cho các request HTTP thường (gây 400 ở một số upstream).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Tắt gzip cho SSE / streaming — tương tự CrawlDataLinkedin đã làm.
    gzip off;

    server {
        listen 8080;
        server_name _;

        # Cấu hình chung cho mọi proxy_pass đi backend
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ──────────────────────────────────────────────────────────────────────
        # Zalo bridge — mount dưới prefix /zalo-bridge/ để nginx forward tới
        # container `zalo-bridge:3001`. Bridge tự hỗ trợ cả path gốc và
        # path có prefix `/zalo-bridge` (xem src/index.js dòng 182-189).
        #
        # LƯU Ý: cần `rewrite` bỏ prefix trước khi proxy tới backend vì
        # bridge chỉ bind path gốc (`/auth`, `/api`, ...). Hoặc giữ nguyên
        # prefix và trông cậy bridge. Mình giữ nguyên prefix vì bridge đã
        # hỗ trợ sẵn cả 2 dạng.
        # ──────────────────────────────────────────────────────────────────────

        # SSE endpoints trong bridge — tắt buffering để event real-time
        # thực sự reach browser ngay khi phát ra.
        location ~ ^/zalo-bridge/api/all-platform/zalo/(events|jobs/events|auth/events) {
            proxy_pass http://zalo-bridge:3001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # WebSocket routes trong bridge (nếu sau này có)
        location ~ ^/zalo-bridge/ws/ {
            proxy_pass http://zalo-bridge:3001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # SSE `/api/all-platform/zalo/events` của Next.js (frontend re-emit
        # bridge events) — cũng phải tắt buffering.
        location ~ ^/api/all-platform/zalo/(events|jobs/events|auth/events) {
            proxy_pass http://frontend:4000;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # Mọi request Zalo bridge còn lại — long timeout để chờ login QR.
        location /zalo-bridge/ {
            proxy_pass http://zalo-bridge:3001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            client_max_body_size 50M;
        }

        # ──────────────────────────────────────────────────────────────────────
        # zalo-account-module (3002) / zalo-forward-module (3003) vẫn publish
        # thẳng port ra host để debug trực tiếp bằng IP:port, nhưng domain
        # thật (vd chat.timetech.vn) trỏ qua router này giống app chính —
        # xem server block riêng theo server_name phía dưới.
        # ──────────────────────────────────────────────────────────────────────

        # ──────────────────────────────────────────────────────────────────────
        # InvoiceFlow Manager frontend (Next.js) — default.
        # Next.js App Router có RSC streaming → cũng cần tắt buffering để
        # response được gửi incremental.
        # ──────────────────────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend:4000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            client_max_body_size 50M;
        }
    }

    # ──────────────────────────────────────────────────────────────────────
    # chat.timetech.vn → zalo-account-module ("Quản lý Zalo tập trung").
    # Domain trỏ (qua Cloudflare/DNS) thẳng vào host:8080 (router này) như
    # app chính — KHÔNG cần set thêm rule gì phía ngoài, router tự phân biệt
    # theo Host header rồi forward nội bộ tới zalo-account-module:3002 và
    # /zalo-bridge/* tới zalo-bridge:3001 (bridge chung với app chính).
    # ──────────────────────────────────────────────────────────────────────
    server {
        listen 8080;
        server_name chat.timetech.vn;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE tin nhắn real-time (EventSource client-side gọi thẳng bridge
        # qua NEXT_PUBLIC_ZALO_BRIDGE_URL=/zalo-bridge) — tắt buffering.
        location ~ ^/zalo-bridge/api/all-platform/zalo/(events|jobs/events|auth/events) {
            proxy_pass http://zalo-bridge:3001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        location /zalo-bridge/ {
            proxy_pass http://zalo-bridge:3001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            client_max_body_size 50M;
        }

        location / {
            proxy_pass http://zalo-account-module:3002;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            client_max_body_size 50M;
        }
    }
}
