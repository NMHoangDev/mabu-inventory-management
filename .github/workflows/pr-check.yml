name: PR Build Check

# Kiem tra code build/typecheck duoc TRUOC khi cho phep merge PR vao main.
# CHI build-check, KHONG deploy len bat ky host nao - chay tren runner
# GitHub-hosted (ubuntu-latest), an toan cho code chua duoc duyet, khong
# dung toi self-hosted runner cua production.
on:
  pull_request:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (kiem tra loi Next.js/TypeScript/syntax)
        run: npm run build
        env:
          # Gia tri gia - chi de build khong bi crash khi doc process.env,
          # KHONG phai secret thuc. App khong ket noi DB/Supabase luc build
          # (pg pool + Supabase client deu lazy-init khi co request thuc).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_ZALO_BRIDGE_URL: http://localhost:3001
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
